document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ar%20um%20diagn%C3%B3stico%20patrimonial.\" style=\"border: 1px solid #B18A46; padding: 11px 20px; font-size: 14px; font-weight: 600\">Falar no WhatsApp<\u002Fa>\n<\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"topo\">\n\n<section style=\"padding: clamp(48px, 8vw, 104px) clamp(20px, 5vw, 80px) clamp(56px, 9vw, 112px)\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 56px\">\n<div style=\"flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div style=\"width: 40px; height: 1px; background: #B18A46\"><\u002Fdiv>\n<span style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: #B18A46\">Defesa patrimonial · Recuperação · Sucessão<\u002Fspan>\n<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(36px, 6vw, 66px); line-height: 1.08; letter-spacing: -0.01em\">\n<span style=\"display: block; color: rgba(244,235,221,0.55)\">Chegou uma citação de cobrança.<\u002Fspan>\n<span style=\"display: block\">O prazo para responder já está correndo.<\u002Fspan>\n<\u002Fh1>\n<p style=\"margin: 0; max-width: 580px; color: rgba(244,235,221,0.82)\">Defesa patrimonial é agir cedo: ler a citação, medir o risco para a terra, a safra, a conta e a família, e escolher entre defender, negociar ou reestruturar. Cobrança, recuperação e herança são três frentes de uma mesma estratégia.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 20px 28px; margin-top: 8px\">\n<a href=\"#citacao\" style=\"background: #B18A46; color: #0B2A44; padding: 16px 28px; font-weight: 600; font-size: 17px; display: inline-flex; align-items: center; gap: 12px\">Recebi uma citação <span>→<\u002Fspan><\u002Fa>\n<a href=\"#frentes\" style=\"color: #F4EBDD; font-size: 15px; border-bottom: 1px solid #B18A46; padding-bottom: 2px\">Ver as três frentes<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 14px; margin-top: 24px; font-size: 13px; letter-spacing: 0.08em; color: rgba(244,235,221,0.65)\">\n<div style=\"width: 36px; height: 1px; background: rgba(244,235,221,0.45)\"><\u002Fdiv>\n<span>Vinicius Machado · OAB/PR 98.226<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 320px; min-width: 0; max-width: 460px; border: 1px solid #B18A46; padding: 8px; margin: 0 auto\">\n<div style=\"border: 1px solid rgba(177,138,70,0.45); padding: clamp(12px, 3vw, 28px)\">\n<img src=\"a207eafa-6a9d-41e8-9daf-e52ab6849140\" alt=\"Monograma VM com coluna, dentro de círculo e losango dourados\" style=\"width: 100%; height: auto; display: block\">\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding: 36px clamp(20px, 5vw, 80px); border-top: 1px solid rgba(177,138,70,0.35); border-bottom: 1px solid rgba(177,138,70,0.35)\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 28px 48px\">\n<p style=\"margin: 0; flex: 1 1 320px; font-family: 'Newsreader', serif; font-style: italic; font-size: 24px; line-height: 1.35\">Atuação exclusiva ao lado do devedor. Nunca do lado do banco.<\u002Fp>\n<div style=\"flex: 2 1 480px; display: flex; flex-wrap: wrap; gap: 12px\">\n<span style=\"border: 1px solid rgba(177,138,70,0.6); padding: 8px 16px; font-size: 14px\">Produtor rural<\u002Fspan>\n<span style=\"border: 1px solid rgba(177,138,70,0.6); padding: 8px 16px; font-size: 14px\">Empresa do agronegócio<\u002Fspan>\n<span style=\"border: 1px solid rgba(177,138,70,0.6); padding: 8px 16px; font-size: 14px\">Microempresa e EPP<\u002Fspan>\n<span style=\"border: 1px solid rgba(177,138,70,0.6); padding: 8px 16px; font-size: 14px\">Sócio avalista<\u002Fspan>\n<span style=\"border: 1px solid rgba(177,138,70,0.6); padding: 8px 16px; font-size: 14px\">Família herdeira<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"frentes\" style=\"background: #F4EBDD; color: #35404A; padding: clamp(56px, 9vw, 112px) clamp(20px, 5vw, 80px)\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 720px\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div style=\"width: 40px; height: 1px; background: #B18A46\"><\u002Fdiv>\n<span style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: #35404A\">Áreas de atuação<\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(30px, 4.4vw, 48px); line-height: 1.12; color: #0B2A44\">Três frentes. Uma estratégia para o patrimônio.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<a href=\"#citacao\" style=\"flex: 1 1 300px; min-width: 0; display: block; border: 1px solid rgba(177,138,70,0.8); padding: 6px\">\n<div style=\"border: 1px solid rgba(177,138,70,0.4); padding: 32px 28px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 18px; color: #35404A\">01<\u002Fspan>\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 28px; line-height: 1.15; color: #0B2A44\">Defesa patrimonial<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">Citação de cobrança, execução, bloqueios e garantias: o que fazer, o que evitar e quais defesas existem.<\u002Fp>\n<span style=\"margin-top: auto; padding-top: 12px; font-weight: 600; font-size: 15px; color: #0B2A44; border-top: 1px solid rgba(177,138,70,0.5)\">O que fazer ao receber uma citação →<\u002Fspan>\n<\u002Fdiv>\n<\u002Fa>\n<a href=\"#recuperacao\" style=\"flex: 1 1 300px; min-width: 0; display: block; border: 1px solid rgba(177,138,70,0.8); padding: 6px\">\n<div style=\"border: 1px solid rgba(177,138,70,0.4); padding: 32px 28px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 18px; color: #35404A\">02<\u002Fspan>\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 28px; line-height: 1.15; color: #0B2A44\">Recuperação judicial e extrajudicial<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">Quando a dívida passa do que a operação suporta: acordo com credores, recuperação e plano especial para ME e EPP.<\u002Fp>\n<span style=\"margin-top: auto; padding-top: 12px; font-weight: 600; font-size: 15px; color: #0B2A44; border-top: 1px solid rgba(177,138,70,0.5)\">Entender os caminhos →<\u002Fspan>\n<\u002Fdiv>\n<\u002Fa>\n<a href=\"#heranca\" style=\"flex: 1 1 300px; min-width: 0; display: block; border: 1px solid rgba(177,138,70,0.8); padding: 6px\">\n<div style=\"border: 1px solid rgba(177,138,70,0.4); padding: 32px 28px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 18px; color: #35404A\">03<\u002Fspan>\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 28px; line-height: 1.15; color: #0B2A44\">Herança e sucessão<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">Quando alguém morre, o patrimônio precisa ser inventariado e partilhado. E, antes disso, pode ser organizado.<\u002Fp>\n<span style=\"margin-top: auto; padding-top: 12px; font-weight: 600; font-size: 15px; color: #0B2A44; border-top: 1px solid rgba(177,138,70,0.5)\">Ver inventário e planejamento →<\u002Fspan>\n<\u002Fdiv>\n<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"citacao\" style=\"padding: clamp(56px, 9vw, 112px) clamp(20px, 5vw, 80px)\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px 72px\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 24px; align-self: flex-start\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div style=\"width: 40px; height: 1px; background: #B18A46\"><\u002Fdiv>\n<span style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: #B18A46\">Frente 01 · Defesa patrimonial<\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(30px, 4.4vw, 48px); line-height: 1.12\">Recebeu uma citação de cobrança? Comece por aqui.<\u002Fh2>\n<p style=\"margin: 0; color: rgba(244,235,221,0.82)\">Citação é o aviso formal de que existe um processo contra você. Não é sentença, mas é a partir dela que os prazos passam a correr. Estes são os cinco primeiros passos.<\u002Fp>\n<a href=\"https://wa.me/5545998562227?text=Ol%C3%A1%2C%20recebi%20uma%20cita%C3%A7%C3%A3o%20de%20cobran%C3%A7a%20e%20preciso%20de%20orienta%C3%A7%C3%A3o.\" style=\"align-self: flex-start; background: #B18A46; color: #0B2A44; padding: 16px 26px; font-weight: 600; display: inline-flex; align-items: center; gap: 12px\">Falar sobre minha citação <span>→<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<div style=\"flex: 1.4 1 420px; min-width: 0; display: flex; flex-direction: column\">\n<div style=\"display: flex; gap: 22px; padding: 24px 0; border-top: 1px solid rgba(177,138,70,0.4)\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 34px; line-height: 1; color: #B18A46; min-width: 44px\">01<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 24px; line-height: 1.2\">Não ignore e não assine nada às pressas.<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; color: rgba(244,235,221,0.82)\">Quem não responde no prazo é considerado revel, e os fatos alegados na inicial passam a ser presumidos verdadeiros (CPC, art. 344). Acordos assinados sem análise costumam sair caros.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 22px; padding: 24px 0; border-top: 1px solid rgba(177,138,70,0.4)\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 34px; line-height: 1; color: #B18A46; min-width: 44px\">02<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 24px; line-height: 1.2\">Anote a data e leia o mandado.<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; color: rgba(244,235,221,0.82)\">Cada ação tem prazo próprio. Na ação de cobrança, a contestação vence em 15 dias úteis (CPC, art. 335). Na execução de título extrajudicial, são 3 dias para pagar (art. 829) e 15 para embargar (art. 915). Confira no documento recebido: a contagem depende da forma da citação.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 22px; padding: 24px 0; border-top: 1px solid rgba(177,138,70,0.4)\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 34px; line-height: 1; color: #B18A46; min-width: 44px\">03<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 24px; line-height: 1.2\">Reúna os documentos.<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; color: rgba(244,235,221,0.82)\">Contrato ou cédula, extratos, notificações, comprovantes de pagamento, matrículas e garantias. Sem eles, não há defesa técnica.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 22px; padding: 24px 0; border-top: 1px solid rgba(177,138,70,0.4)\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 34px; line-height: 1; color: #B18A46; min-width: 44px\">04<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 24px; line-height: 1.2\">Procure um advogado antes do prazo vencer.<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; color: rgba(244,235,221,0.82)\">Conforme o caso, há contestação, embargos, discussão de juros e encargos, revisão de garantias e proposta de acordo. Quanto antes, mais opções.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 22px; padding: 24px 0; border-top: 1px solid rgba(177,138,70,0.4); border-bottom: 1px solid rgba(177,138,70,0.4)\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 34px; line-height: 1; color: #B18A46; min-width: 44px\">05<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 24px; line-height: 1.2\">Não transfira bens para escapar da cobrança.<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; color: rgba(244,235,221,0.82)\">Vender ou doar bens enquanto corre ação capaz de levar à insolvência pode configurar fraude à execução (CPC, art. 792, IV), e o ato é declarado ineficaz. Proteção patrimonial se faz com estratégia, não com pressa.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 20px 0 0; font-size: 14px; color: rgba(244,235,221,0.65)\">Prazos variam conforme o tipo de ação e a forma de citação. Este texto é informativo e não substitui a análise do seu documento.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #F4EBDD; color: #35404A; padding: clamp(56px, 9vw, 112px) clamp(20px, 5vw, 80px)\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px\">\n<div style=\"display: flex; flex-direction: column; gap: 32px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 720px\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div style=\"width: 40px; height: 1px; background: #B18A46\"><\u002Fdiv>\n<span style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: #35404A\">O que a cobrança alcança<\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(30px, 4.4vw, 48px); line-height: 1.12; color: #0B2A44\">Quando a dívida vence, ela não olha só para o contrato.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 28px 32px\">\n<div style=\"flex: 1 1 220px; min-width: 0; border-top: 1px solid #B18A46; padding-top: 18px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 22px; color: #0B2A44\">Terra e benfeitorias<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Hipoteca e alienação fiduciária colocam a matrícula na mesa.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 220px; min-width: 0; border-top: 1px solid #B18A46; padding-top: 18px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 22px; color: #0B2A44\">Safra e maquinário<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Penhor rural, CPR e cédulas alcançam produção e equipamento.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 220px; min-width: 0; border-top: 1px solid #B18A46; padding-top: 18px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 22px; color: #0B2A44\">Aval pessoal<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Quem avalizou a dívida da empresa responde com o próprio nome.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 220px; min-width: 0; border-top: 1px solid #B18A46; padding-top: 18px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 22px; color: #0B2A44\">Contas e recebíveis<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Bloqueio judicial e travas bancárias paralisam a operação em horas.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 340px; min-width: 0; background: #0B2A44; color: #F4EBDD; padding: 36px 32px; display: flex; flex-direction: column; gap: 20px\">\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 26px; color: #B18A46\">O que a lei protege<\u002Fh3>\n<div style=\"display: flex; flex-direction: column; gap: 16px; font-size: 16px\">\n<p style=\"margin: 0; padding-top: 16px; border-top: 1px solid rgba(177,138,70,0.35)\">Pequena propriedade rural trabalhada pela família (Constituição, art. 5º, XXVI; CPC, art. 833, VIII).<\u002Fp>\n<p style=\"margin: 0; padding-top: 16px; border-top: 1px solid rgba(177,138,70,0.35)\">Imóvel residencial da família, como bem de família (Lei 8.009/1990).<\u002Fp>\n<p style=\"margin: 0; padding-top: 16px; border-top: 1px solid rgba(177,138,70,0.35)\">O direito de discutir cláusulas abusivas, juros e encargos indevidos em contratos bancários.<\u002Fp>\n<p style=\"margin: 0; padding-top: 16px; border-top: 1px solid rgba(177,138,70,0.35)\">A possibilidade de negociar e reestruturar a dívida antes que a execução avance.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 340px; min-width: 0; border: 1px solid rgba(177,138,70,0.8); padding: 6px\">\n<div style=\"border: 1px solid rgba(177,138,70,0.4); padding: 30px 26px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px\">\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 26px; color: #0B2A44\">O que ela não protege<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">Transferir bens depois que a dívida já existe, para escapar dela. Fraude contra credores (Código Civil, arts. 158 a 165) e fraude à execução (CPC, art. 792) podem tornar o ato ineficaz.<\u002Fp>\n<p style=\"margin: 0; font-family: 'Newsreader', serif; font-style: italic; font-size: 22px; line-height: 1.35; color: #0B2A44\">Por isso a estrutura patrimonial se faz antes da crise, com finalidade lícita e documentada.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"recuperacao\" style=\"padding: clamp(56px, 9vw, 112px) clamp(20px, 5vw, 80px)\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 760px\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div style=\"width: 40px; height: 1px; background: #B18A46\"><\u002Fdiv>\n<span style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: #B18A46\">Frente 02 · Recuperação judicial e extrajudicial<\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(30px, 4.4vw, 48px); line-height: 1.12\">Quando a situação fica complexa, existe mais de um caminho.<\u002Fh2>\n<p style=\"margin: 0; color: rgba(244,235,221,0.82)\">Nem toda crise pede recuperação judicial. A escolha depende do tamanho da dívida, de quem são os credores e de quanto a operação ainda gera de caixa.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 40px 48px\">\n<div style=\"flex: 1 1 280px; min-width: 0; border-top: 1px solid #B18A46; padding-top: 24px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 18px; color: #B18A46\">Caminho A<\u002Fspan>\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 26px\">Renegociação<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; color: rgba(244,235,221,0.82)\">Alongamento, carência e revisão de encargos, negociados direto com o banco ou o credor, sem processo coletivo. É o primeiro caminho a ser testado.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0; border-top: 1px solid #B18A46; padding-top: 24px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 18px; color: #B18A46\">Caminho B<\u002Fspan>\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 26px\">Recuperação extrajudicial<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; color: rgba(244,235,221,0.82)\">Acordo com os credores, levado ao juiz para homologação, com adesão de mais de 3/5 dos créditos de cada espécie incluída. Não alcança créditos trabalhistas e tributários (Lei 11.101/2005, arts. 161 a 167).<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0; border-top: 1px solid #B18A46; padding-top: 24px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 18px; color: #B18A46\">Caminho C<\u002Fspan>\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 26px\">Recuperação judicial<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; color: rgba(244,235,221,0.82)\">Pedido ao juiz para reorganizar as dívidas sujeitas ao plano, com suspensão temporária de ações e execuções (art. 6º). Pode ser requerida também por produtor rural, pessoa física ou jurídica, que comprove atividade rural regular por mais de dois anos (art. 48).<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #F4EBDD; color: #35404A; border: 1px solid #B18A46; padding: 8px\">\n<div style=\"border: 1px solid rgba(177,138,70,0.55); padding: clamp(28px, 5vw, 52px) clamp(20px, 4vw, 48px); display: flex; flex-direction: column; gap: 28px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 760px\">\n<span style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: #35404A\">Lei 11.101/2005, arts. 70 a 72<\u002Fspan>\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.15; color: #0B2A44\">Plano especial para microempresa e empresa de pequeno porte.<\u002Fh3>\n<p style=\"margin: 0\">Quem se enquadra como ME ou EPP (conforme a LC 123/2006) pode optar por um caminho mais enxuto dentro da recuperação judicial.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px 32px\">\n<div style=\"flex: 1 1 200px; min-width: 0; border-top: 1px solid #B18A46; padding-top: 14px\">\n<div style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: 30px; line-height: 1.1; color: #0B2A44\">até 36<\u002Fdiv>\n<div style=\"font-size: 15px; margin-top: 6px\">parcelas mensais, com juros pela taxa Selic<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 200px; min-width: 0; border-top: 1px solid #B18A46; padding-top: 14px\">\n<div style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: 30px; line-height: 1.1; color: #0B2A44\">até 180 dias<\u002Fdiv>\n<div style=\"font-size: 15px; margin-top: 6px\">para pagar a primeira parcela, contados do pedido<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 200px; min-width: 0; border-top: 1px solid #B18A46; padding-top: 14px\">\n<div style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: 30px; line-height: 1.1; color: #0B2A44\">sem assembleia<\u002Fdiv>\n<div style=\"font-size: 15px; margin-top: 6px\">de credores para votar o plano<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 200px; min-width: 0; border-top: 1px solid #B18A46; padding-top: 14px\">\n<div style=\"font-family: 'Newsreader', serif; font-weight: 500; font-size: 30px; line-height: 1.1; color: #0B2A44\">sem garantia<\u002Fdiv>\n<div style=\"font-size: 15px; margin-top: 6px\">abrange só os créditos quirografários<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 0; padding-top: 20px; border-top: 1px solid rgba(53,64,74,0.25); font-size: 16px\"><strong>Atenção ao limite.<\u002Fstrong> O plano especial não suspende ações e execuções dos créditos que ficam de fora dele (art. 72, parágrafo único). Por isso, antes de pedir, é preciso mapear quais dívidas entram e quais continuam sendo cobradas.<\u002Fp>\n<a href=\"https://wa.me/5545998562227?text=Ol%C3%A1%2C%20gostaria%20de%20avaliar%20recupera%C3%A7%C3%A3o%20judicial%20ou%20extrajudicial.\" style=\"align-self: flex-start; background: #0B2A44; color: #F4EBDD; padding: 16px 26px; font-weight: 600; display: inline-flex; align-items: center; gap: 12px\">Avaliar o meu caso <span>→<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"heranca\" style=\"background: #F4EBDD; color: #35404A; padding: clamp(56px, 9vw, 112px) clamp(20px, 5vw, 80px)\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 760px\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div style=\"width: 40px; height: 1px; background: #B18A46\"><\u002Fdiv>\n<span style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: #35404A\">Frente 03 · Herança e sucessão<\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(30px, 4.4vw, 48px); line-height: 1.12; color: #0B2A44\">Quando alguém morre, o patrimônio não se resolve sozinho.<\u002Fh2>\n<p style=\"margin: 0\">Imóveis, terras, contas e quotas de empresa ficam travados até o inventário. E as dívidas do falecido também entram na conta.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1.2 1 380px; min-width: 0; border: 1px solid rgba(177,138,70,0.8); padding: 6px\">\n<div style=\"border: 1px solid rgba(177,138,70,0.4); padding: 32px 28px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0 0 12px; font-family: 'Newsreader', serif; font-weight: 600; font-size: 26px; color: #0B2A44\">Depois do falecimento<\u002Fh3>\n<div style=\"display: flex; gap: 18px; padding: 16px 0; border-top: 1px solid rgba(177,138,70,0.5)\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 24px; line-height: 1.2; color: #0B2A44; min-width: 32px\">1<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><strong style=\"color: #0B2A44\">Levantar bens e dívidas<\u002Fstrong><span style=\"font-size: 16px\">Certidão de óbito, matrículas, extratos, quotas e contratos em nome do falecido.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 18px; padding: 16px 0; border-top: 1px solid rgba(177,138,70,0.5)\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 24px; line-height: 1.2; color: #0B2A44; min-width: 32px\">2<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><strong style=\"color: #0B2A44\">Escolher a via<\u002Fstrong><span style=\"font-size: 16px\">Se todos os herdeiros forem capazes e concordes, o inventário pode ser feito em cartório, com advogado. Havendo testamento ou herdeiro incapaz, segue a via judicial (CPC, art. 610).<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 18px; padding: 16px 0; border-top: 1px solid rgba(177,138,70,0.5)\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 24px; line-height: 1.2; color: #0B2A44; min-width: 32px\">3<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><strong style=\"color: #0B2A44\">Respeitar o prazo<\u002Fstrong><span style=\"font-size: 16px\">O inventário deve ser aberto em até dois meses da morte (CPC, art. 611). O imposto de transmissão (ITCMD) segue a lei do estado, e atrasos podem gerar multa.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 18px; padding: 16px 0; border-top: 1px solid rgba(177,138,70,0.5)\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 24px; line-height: 1.2; color: #0B2A44; min-width: 32px\">4<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><strong style=\"color: #0B2A44\">Pagar dívidas, partilhar e registrar<\u002Fstrong><span style=\"font-size: 16px\">As dívidas são pagas com a herança, e o herdeiro não responde além do que recebeu (Código Civil, arts. 1.792 e 1.997). Depois vêm a partilha e o registro em nome dos herdeiros.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 340px; min-width: 0; background: #0B2A44; color: #F4EBDD; padding: 36px 32px; display: flex; flex-direction: column; gap: 20px\">\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 26px; color: #B18A46\">Antes: planejamento sucessório<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">Quem tem terra, empresa ou mais de um núcleo familiar pode organizar a transmissão em vida:<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 14px; font-size: 16px\">\n<p style=\"margin: 0; padding-top: 14px; border-top: 1px solid rgba(177,138,70,0.35)\">Holding ou SPE rural, para separar terra, produção, caixa e responsabilidade.<\u002Fp>\n<p style=\"margin: 0; padding-top: 14px; border-top: 1px solid rgba(177,138,70,0.35)\">Doação com reserva de usufruto.<\u002Fp>\n<p style=\"margin: 0; padding-top: 14px; border-top: 1px solid rgba(177,138,70,0.35)\">Testamento.<\u002Fp>\n<p style=\"margin: 0; padding-top: 14px; border-top: 1px solid rgba(177,138,70,0.35)\">Acordo de sócios com regras para a sucessão das quotas.<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin: 0; padding-top: 18px; border-top: 1px solid #B18A46; font-family: 'Newsreader', serif; font-style: italic; font-size: 20px; line-height: 1.4\">Metade do patrimônio pertence por lei aos herdeiros necessários (Código Civil, art. 1.846). O planejamento trabalha com a outra metade e com a forma de transmitir.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<a href=\"https://wa.me/5545998562227?text=Ol%C3%A1%2C%20preciso%20resolver%20uma%20heran%C3%A7a%20ou%20planejar%20a%20sucess%C3%A3o.\" style=\"align-self: flex-start; background: #0B2A44; color: #F4EBDD; padding: 16px 26px; font-weight: 600; display: inline-flex; align-items: center; gap: 12px\">Falar sobre herança <span>→<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding: clamp(56px, 9vw, 112px) clamp(20px, 5vw, 80px)\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 720px\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div style=\"width: 40px; height: 1px; background: #B18A46\"><\u002Fdiv>\n<span style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: #B18A46\">Como trabalhamos<\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(30px, 4.4vw, 48px); line-height: 1.12\">Antes de agir, entender o cenário.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 40px 48px\">\n<div style=\"flex: 1 1 280px; min-width: 0; border-top: 1px solid #B18A46; padding-top: 24px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 40px; color: #B18A46; line-height: 1\">01<\u002Fspan>\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 26px\">Escuta e documentos<\u002Fh3>\n<p style=\"margin: 0; color: rgba(244,235,221,0.82); font-size: 16px\">Contratos, matrículas, garantias, avais, processos e certidões. Um retrato fiel de onde você está, antes de qualquer decisão.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0; border-top: 1px solid #B18A46; padding-top: 24px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 40px; color: #B18A46; line-height: 1\">02<\u002Fspan>\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 26px\">Estratégia<\u002Fh3>\n<p style=\"margin: 0; color: rgba(244,235,221,0.82); font-size: 16px\">Defender, negociar, reestruturar ou planejar: alternativas, riscos e custos explicados com clareza, sem solução pronta.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0; border-top: 1px solid #B18A46; padding-top: 24px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-family: 'Newsreader', serif; font-size: 40px; color: #B18A46; line-height: 1\">03<\u002Fspan>\n<h3 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 26px\">Execução<\u002Fh3>\n<p style=\"margin: 0; color: rgba(244,235,221,0.82); font-size: 16px\">Peças, negociações, estruturas e acompanhamento do caso, com orientação sobre os efeitos de cada medida.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"perguntas\" style=\"background: #F4EBDD; color: #35404A; padding: clamp(56px, 9vw, 112px) clamp(20px, 5vw, 80px)\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px 80px\">\n<div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px; align-self: flex-start\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div style=\"width: 40px; height: 1px; background: #B18A46\"><\u002Fdiv>\n<span style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: #35404A\">Dúvidas frequentes<\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(30px, 4.4vw, 48px); line-height: 1.12; color: #0B2A44\">O que vale a pena entender antes.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex: 1.5 1 440px; min-width: 0; display: flex; flex-direction: column; border-top: 1px solid rgba(53,64,74,0.3)\">\n<details style=\"border-bottom: 1px solid rgba(53,64,74,0.3); padding: 20px 0\">\n<summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 24px; font-family: 'Newsreader', serif; font-weight: 600; font-size: 21px; line-height: 1.3; color: #0B2A44\">Recebi a citação. Posso resolver direto com o banco?<span class=\"faq-plus\" style=\"font-size: 28px; line-height: 1; color: #35404A; transition: transform 0.2s\">+<\u002Fspan><\u002Fsummary>\n<p style=\"margin: 14px 0 0; font-size: 16px; max-width: 640px\">Pode negociar, mas o prazo do processo continua correndo. Negociação em andamento não suspende o prazo de resposta por si só, então a defesa e a conversa precisam andar juntas.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid rgba(53,64,74,0.3); padding: 20px 0\">\n<summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 24px; font-family: 'Newsreader', serif; font-weight: 600; font-size: 21px; line-height: 1.3; color: #0B2A44\">O plano especial de ME e EPP é sempre o melhor?<span class=\"faq-plus\" style=\"font-size: 28px; line-height: 1; color: #35404A; transition: transform 0.2s\">+<\u002Fspan><\u002Fsummary>\n<p style=\"margin: 14px 0 0; font-size: 16px; max-width: 640px\">Não. Ele é mais simples e dispensa assembleia, mas alcança só créditos sem garantia e não suspende a cobrança das demais dívidas. Em muitos casos, o caminho comum ou uma renegociação funcionam melhor. Cada situação pede análise própria.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid rgba(53,64,74,0.3); padding: 20px 0\">\n<summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 24px; font-family: 'Newsreader', serif; font-weight: 600; font-size: 21px; line-height: 1.3; color: #0B2A44\">Pessoa física pode pedir recuperação judicial?<span class=\"faq-plus\" style=\"font-size: 28px; line-height: 1; color: #35404A; transition: transform 0.2s\">+<\u002Fspan><\u002Fsummary>\n<p style=\"margin: 14px 0 0; font-size: 16px; max-width: 640px\">O produtor rural pessoa física pode, se comprovar o exercício regular da atividade rural. Para o consumidor endividado, existe outro caminho: a repactuação por superendividamento (Lei 14.181/2021).<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid rgba(53,64,74,0.3); padding: 20px 0\">\n<summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 24px; font-family: 'Newsreader', serif; font-weight: 600; font-size: 21px; line-height: 1.3; color: #0B2A44\">Posso fazer o inventário sem advogado?<span class=\"faq-plus\" style=\"font-size: 28px; line-height: 1; color: #35404A; transition: transform 0.2s\">+<\u002Fspan><\u002Fsummary>\n<p style=\"margin: 14px 0 0; font-size: 16px; max-width: 640px\">Não. Tanto o inventário em cartório quanto o judicial exigem a assistência de advogado.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid rgba(53,64,74,0.3); padding: 20px 0\">\n<summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 24px; font-family: 'Newsreader', serif; font-weight: 600; font-size: 21px; line-height: 1.3; color: #0B2A44\">O atendimento pode ser feito à distância?<span class=\"faq-plus\" style=\"font-size: 28px; line-height: 1; color: #35404A; transition: transform 0.2s\">+<\u002Fspan><\u002Fsummary>\n<p style=\"margin: 14px 0 0; font-size: 16px; max-width: 640px\">Sim. A conversa inicial e boa parte do trabalho podem ser conduzidas remotamente, conforme a natureza do caso e a necessidade de atos presenciais.<\u002Fp>\n<\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contato\" style=\"padding: clamp(56px, 9vw, 112px) clamp(20px, 5vw, 80px)\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px 80px; align-items: flex-start\">\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<div style=\"width: 40px; height: 1px; background: #B18A46\"><\u002Fdiv>\n<span style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: #B18A46\">Diagnóstico patrimonial<\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(30px, 4.4vw, 48px); line-height: 1.12\">Conte o que aconteceu. A conversa começa pelo WhatsApp.<\u002Fh2>\n<p style=\"margin: 0; color: rgba(244,235,221,0.82)\">Escolha o assunto e a mensagem já abre pronta. Você sai da conversa com a leitura do cenário, os pontos de maior exposição e os caminhos possíveis, sem promessa de resultado.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 4px; margin-top: 8px\">\n<span style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: #B18A46\">Contato oficial<\u002Fspan>\n<a href=\"https://wa.me/5545998562227\" style=\"font-family: 'Newsreader', serif; font-size: 30px; font-weight: 500\">(45) 99856-2227<\u002Fa>\n<a href=\"https://www.instagram.com/adv.viniciusbmachado/\" style=\"font-size: 15px; color: rgba(244,235,221,0.75)\">Instagram @adv.viniciusbmachado<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 380px; min-width: 0; border: 1px solid #B18A46; padding: 8px\">\n<div style=\"border: 1px solid rgba(177,138,70,0.45); padding: clamp(20px, 4vw, 36px); display: flex; flex-direction: column; gap: 0\">\n<span style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: #B18A46; margin-bottom: 8px\">Qual é o assunto?<\u002Fspan>\n<a href=\"https://wa.me/5545998562227?text=Ol%C3%A1%2C%20recebi%20uma%20cita%C3%A7%C3%A3o%20de%20cobran%C3%A7a%20e%20preciso%20de%20orienta%C3%A7%C3%A3o.\" style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; border-top: 1px solid rgba(177,138,70,0.4); font-family: 'Newsreader', serif; font-size: 22px; line-height: 1.25\"><span>Recebi uma citação de cobrança<\u002Fspan><span style=\"color: #B18A46\">→<\u002Fspan><\u002Fa>\n<a href=\"https://wa.me/5545998562227?text=Ol%C3%A1%2C%20gostaria%20de%20avaliar%20recupera%C3%A7%C3%A3o%20judicial%20ou
